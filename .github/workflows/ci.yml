name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caifuclaw_business_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: caifuclaw_business_app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r caifuclaw_business_app/requirements.txt
          pip install -r connector_runtime/requirements.txt
      - name: Create CI configuration
        shell: bash
        run: |
          cp caifuclaw_business_app/config.template.toml caifuclaw_business_app/config.toml
          python - <<'PY'
          from pathlib import Path
          path = Path('caifuclaw_business_app/config.toml')
          text = path.read_text()
          replacements = {
              'REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS': 'ci-random-service-secret-0123456789012345',
              'REPLACE_WITH_AT_LEAST_12_RANDOM_CHARACTERS': 'ci-admin-password-012345',
              'host = "localhost"': 'host = "127.0.0.1"',
              'password = "change-me"': 'password = "ci-postgres-password"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python scripts/init_databases.py
      - name: Run business tests
        working-directory: caifuclaw_business_app
        run: python -m pytest -q
      - name: Run connector tests
        working-directory: connector_runtime
        run: python -m pytest -q
      - name: Run root tests
        run: python -m pytest tests -q

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: caifuclaw_business_app/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Audit frontend production dependencies
        working-directory: caifuclaw_business_app/frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r caifuclaw_business_app/requirements.txt
          python -m pip_audit -r connector_runtime/requirements.txt
